<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
<title>Configurações</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>
<main>
  <h1>Configurações</h1>
  <p class="hint">Marque os monitores que mostram o notch e escolha a borda de cada um. Para ajustar o lugar exato, arraste o notch.</p>
  <div id="monitors" class="monitors"></div>
  <label class="lock"><input type="checkbox" id="locked"> Fixar posição (impede arrastar sem querer)</label>
  <h2 class="section">Contas</h2>
  <p class="hint">Contas encontradas nas pastas de login do Claude Code e do Codex CLI. Mude o nome ou as iniciais, oculte uma conta ou adicione outra pasta.</p>
  <div id="accounts" class="accounts"></div>
  <form id="add" class="add" autocomplete="off">
    <h3>Adicionar conta</h3>
    <div class="seg" role="radiogroup" aria-label="Serviço">
      <label><input type="radio" name="provider" value="claude" checked><span>Claude</span></label>
      <label><input type="radio" name="provider" value="codex"><span>Codex</span></label>
    </div>
    <div class="pick">
      <input id="add-dir" type="text" placeholder="Pasta do perfil, por exemplo ~/.claude-trabalho" aria-label="Pasta do perfil" required>
      <button type="button" id="browse">Escolher pasta…</button>
    </div>
    <p id="add-error" class="error" role="alert" hidden></p>
    <button type="submit" class="primary">Adicionar</button>
  </form>
  <p id="status" class="status" role="status" aria-live="polite"></p>
</main>
<script src="settings.js"></script>
</body>
</html>
