<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
<title>Configurações</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>
<main>
  <h1>Configurações</h1>
  <p class="hint">Marque os monitores que mostram o notch e escolha a borda de cada um. Para ajustar o lugar exato, arraste o notch.</p>
  <div id="monitors" class="monitors"></div>
  <label class="lock"><input type="checkbox" id="locked"> Fixar posição (impede arrastar sem querer)</label>
  <h2 class="section">Contas</h2>
  <p class="hint">Mude o nome e as iniciais, oculte uma conta ou adicione outra pasta de login (por exemplo, a pasta <code>.claude-trabalho</code> do seu usuário).</p>
  <div id="accounts" class="accounts"></div>
  <form id="add" class="add" autocomplete="off">
    <select id="add-provider" aria-label="Serviço"><option value="claude">Claude</option><option value="codex">Codex</option></select>
    <input id="add-dir" type="text" placeholder="Pasta completa do perfil" aria-label="Pasta do perfil" required>
    <button type="submit">Adicionar conta</button>
  </form>
  <p id="add-error" class="error" role="alert" hidden></p>
</main>
<script src="settings.js"></script>
</body>
</html>
